# mycelium: your money, read-only, from mycelium's local SQLite mirror of Plaid.
# Stdlib Python only. Every command opens the database read-only and never writes; the
# results (bank, account and merchant names) are outside content, so they taint the task.
name: mycelium
version: 1
description: Your money from mycelium; net worth, account balances, transactions, spending.
examples:
  - what's my net worth?
  - what's the total of my transactions with Whole Foods this year?
  - who did I spend the most with last month?
# No approvers and no secrets: every tool and job is an L0 read, and only the owner may
# approve anything. Grant nobody `request` for mycelium in principals.yaml (owner-only).

tools:
  net_worth:
    description: Net worth now (assets minus liabilities) with its change over 1 day, 30 days and the year.
    run: ./cli.py net_worth
    effect: read                       # read, no secrets: always L0
  account_balances:
    description: Every linked account with its current balance; credit and loan balances are amounts owed.
    run: ./cli.py account_balances
    effect: read
  recent_transactions:
    description: Transactions from the last N days (1-90), newest first, at most 30 shown; amount > 0 is money in.
    run: ./cli.py recent_transactions --days {days}
    effect: read
    args: {days: integer}
  spending_summary:
    description: >-
      Income, spend (net of refunds; Venmo/Zelle paybacks are refunds), top categories and
      merchants for a period, transfers excluded; also invested (net into investment accounts)
      and unmatched_card_payments (to a card that isn't linked): this_month, last_month,
      last_7_days, last_30_days, last_12_months, ytd, all, YYYY-MM, or YYYY-MM-DD..YYYY-MM-DD.
    run: ./cli.py spending_summary --period {period}
    effect: read
    args: {period: string}
  search_transactions:
    description: >-
      Totals (count, money in, money out, net, first and last date) and the newest 25 rows for
      transactions whose merchant, name or category contains query (case-insensitive), in a
      period (as spending_summary; "all" for everything). Totals cover every match. Transfers excluded.
    # --x={x} keeps a value that starts with "-" from reading as a flag.
    run: ./cli.py search_transactions --query={query} --period={period}
    effect: read
    args: {query: string, period: string}
  merchant_totals:
    description: >-
      Spend (net of refunds, so Venmo paybacks offset Venmo spend) and income per merchant for a
      period (as spending_summary), biggest spend first, with counts; limit 1-100 merchants (use
      25 if unsure). Transfers excluded.
    run: ./cli.py merchant_totals --period={period} --limit={limit}
    effect: read
    args: {period: string, limit: integer}

jobs:
  # mycelium's launchd sync runs at 07:00 (npm run launchd:install); summarize after it.
  - id: daily
    schedule: "20 7 * * *"
    run: ./cli.py daily
    effect: read
    level: L0
    timeout_s: 60
    catchup: 2h

# Normal: the daily summary joins the next hourly pulse; it never texts on its own.
report: {max_urgency: normal}
health: {check: ./cli.py health, every: 30m}
